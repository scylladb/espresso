version: 1

# Variables can be overridden via CLI, for example:
# espresso run --profile espresso_profiles/key_value.yaml --var cache_hit_ratio=95
vars:
  row_count: 1000000000
  hot_row_count: 0
  cache_hit_ratio: 80
  offset: 0
  populate_operation_count: 1000000

target:
  kind: alternator
  nodes:
    - http://node1:8000
    - http://node2:8000
    - http://node3:8000
  region: us-east-1
  auth:
    access_key: test
    secret_key: test
  tls:
    enabled: false

tables:
  - name: key_value_a
    billing_mode: pay_per_request
    key_schema:
      partition_key:
        name: key
        type: N
    attributes:
      - name: key
        type: N
      - name: val
        type: B
        size_bytes: 1024

  - name: key_value_b
    billing_mode: pay_per_request
    key_schema:
      partition_key:
        name: key
        type: N
    attributes:
      - name: key
        type: N
      - name: val
        type: B
        size_bytes: 2048

schema:
  create_if_missing: true
  delete_if_exists: false
  apply_to_tables: all

phases:
  - name: populate
    mode: operation_count
    operations: ${vars.populate_operation_count}
    concurrency: 256
    warmup: 0s
    include_in_metrics: false
    table_operations:
      - table: key_value_a
        mix:
          put_item: 1.0
        operation_templates:
          put_item:
            item:
              strategy: generated_from_vars
              key_field: key
              value_field: val

      - table: key_value_b
        mix:
          put_item: 1.0
        operation_templates:
          put_item:
            item:
              strategy: generated_from_vars
              key_field: key
              value_field: val

  - name: run_read_heavy
    mode: duration
    duration: 60s
    concurrency: 256
    warmup: 10s
    include_in_metrics: true
    table_operations:
      - table: key_value_a
        mix:
          get_item: 0.9
          put_item: 0.1
        operation_templates:
          get_item:
            key:
              strategy: cached_working_set
              key_field: key
              use_vars: true
          put_item:
            item:
              strategy: generated_from_vars
              key_field: key
              value_field: val

      - table: key_value_b
        vars_overrides:
          row_count: 500000000
        mix:
          get_item: 0.7
          put_item: 0.3
        operation_templates:
          get_item:
            key:
              strategy: uniform
              key_field: key
              use_vars: true
          put_item:
            item:
              strategy: generated_from_vars
              key_field: key
              value_field: val

report:
  live_progress:
    enabled: true
    interval: 1s
  outputs:
    text_summary: true
    json_file: ./results/key_value.json
    hdr_histogram_file: ./results/key_value.hdr

compatibility:
  endpoint_type: alternator
  enforce_supported_operations: true
  write_isolation_mode: unknown