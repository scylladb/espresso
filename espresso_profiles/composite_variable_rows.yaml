version: 1

# Composite-key profile with variable logical row windows per partition.
#
# Use when you want uneven partition sizes (for example some partitions with
# fewer than 10 rows and others close to 90).
#
# Run:
#   espresso run --profile espresso_profiles/composite_variable_rows.yaml --phase populate
#   espresso run --profile espresso_profiles/composite_variable_rows.yaml --phase read_write
#
# Optional overrides:
#   --var row_count=50000
#   --var rows_per_partition_min=1 --var rows_per_partition_max=100

vars:
  row_count: 10000
  rows_per_partition_min: 1
  rows_per_partition_max: 100
  sort_key_offset: 1
  populate_operation_count: 2000000

target:
  kind: alternator
  nodes:
    - http://localhost:8000
  region: us-east-1
  auth:
    access_key: test
    secret_key: test
  tls:
    enabled: false

tables:
  - name: orders_variable
    billing_mode: pay_per_request
    key_schema:
      partition_key:
        name: customer_id
        type: N
      sort_key:
        name: order_seq
        type: N
    attributes:
      - name: customer_id
        type: N
      - name: order_seq
        type: N
      - name: val
        type: B
        size_bytes: 256

schema:
  create_if_missing: true
  delete_if_exists: false
  apply_to_tables: all

phases:
  - name: populate
    mode: operation_count
    operations: ${vars.populate_operation_count}
    concurrency: 128
    warmup: 0s
    include_in_metrics: false
    table_operations:
      - table: orders_variable
        mix:
          put_item: 1.0
        operation_templates:
          put_item:
            item:
              strategy: generated_from_vars
              key_field: customer_id
              value_field: val
              use_vars: true
            sort_key:
              strategy: uniform
              key_field: order_seq
              range: [1, 100]

  - name: read_write
    mode: duration
    duration: 60s
    concurrency: 128
    warmup: 10s
    include_in_metrics: true
    table_operations:
      - table: orders_variable
        mix:
          get_item: 0.8
          put_item: 0.2
        operation_templates:
          get_item:
            key:
              strategy: generated_from_vars
              key_field: customer_id
              use_vars: true
            sort_key:
              strategy: uniform
              key_field: order_seq
              range: [1, 100]
          put_item:
            item:
              strategy: generated_from_vars
              key_field: customer_id
              value_field: val
              use_vars: true
            sort_key:
              strategy: uniform
              key_field: order_seq
              range: [1, 100]

report:
  live_progress:
    enabled: true
    interval: 1s
  outputs:
    text_summary: true
